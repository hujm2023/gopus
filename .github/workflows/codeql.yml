name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            directory: .
            cgo: "0"
          - module: webrtc-control
            directory: examples/webrtc-control
            cgo: "0"
          - module: webrtc-dred-loopback
            directory: examples/webrtc-dred-loopback
            cgo: "1"
    env:
      GOWORK: "off"
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Install desktop build dependencies
        if: matrix.module == 'webrtc-dred-loopback'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - name: Build module
        working-directory: ${{ matrix.directory }}
        run: go build ./...

      - name: Build optional codec features
        if: matrix.module == 'root'
        run: |
          go build -tags purego ./...
          go build -tags 'gopus_dred gopus_osce gopus_qext gopus_custom_modes' ./...
          go build -tags gopus_fixed_point ./...

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go/module:${{ matrix.module }}
