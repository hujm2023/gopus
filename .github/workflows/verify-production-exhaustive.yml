name: Verify Production Exhaustive

on:
  push:
    branches:
      - codex/fix-fixture-provenance
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read

env:
  LIBOPUS_VERSION: "1.6.1"
  GOPUS_DISABLE_OPUSDEC: "0"
  GOPUS_DISABLE_OPUSENC: "1"

concurrency:
  group: exhaustive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-exhaustive-linux:
    name: verify-exhaustive-linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache pinned libopus build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            tmp_check/opus-${{ env.LIBOPUS_VERSION }}
            tmp_check/opus-${{ env.LIBOPUS_VERSION }}.tar.gz
          key: libopus-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBOPUS_VERSION }}-${{ hashFiles('tools/ensure_libopus.sh') }}

      - name: Install codec tools (if missing)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v opusdec >/dev/null 2>&1; then
            echo "ffmpeg and opusdec already present; skipping apt install"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg opus-tools

      - name: Generate native libopus fixtures
        run: make fixtures-gen-platform

      - name: Run exhaustive production verification
        env:
          GOPUS_REQUIRE_PLATFORM_FIXTURES: "1"
        run: make verify-production-exhaustive

      - name: Generate release evidence bundle
        run: make release-evidence

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: reports/release/**
          if-no-files-found: error
