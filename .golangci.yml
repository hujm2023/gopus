version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - appendAssign
        - assignOp
        - badCall
        - builtinShadowDecl
        - captLocal
        - commentedOutCode
        - elseif
        - filepathJoin
        - ifElseChain
        - truncateCmp
        - unlambda
        - unslice
        - valSwap
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: unreachable-code
    staticcheck:
      # v1 ran the SA/S checks through staticcheck plus gosimple with these ST
      # checks excluded by default, and never ran the QF quickfix category. v2
      # merges all four families into staticcheck, so the v1 set is spelled out to
      # keep the enforced checks unchanged.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF*
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - revive
        path: example_test\.go
      # Preserve explicit nil checks in decode hot paths until the codec cleanup lane
      # takes them on; they are deliberate and not worth churn for this baseline.
      - linters:
          - staticcheck
        text: 'S1009:'
      - linters:
          - staticcheck
        text: 'S1021:'
      - linters:
          - staticcheck
        text: 'S1031:'
      # Existing trace-hook placeholders currently trip SA9003 in CELT internals.
      - linters:
          - staticcheck
        path: ^internal/celt/
        text: 'SA9003:'
      # CELT parity trace hooks deliberately return unexported instrumentation
      # types consumed only by in-package libopus parity tests.
      - linters:
          - revive
        path: ^internal/celt/(plc|synthesis)_stage_trace\.go$
        text: 'unexported-return:'
      # opusVal16/opusVal32/celtNorm/celtGLog/celtEner are aliases of float32, so
      # returning one — or a slice of one — exposes nothing a caller cannot already
      # name. revive's unexported-return matches the alias name instead of the
      # underlying type.
      - linters:
          - revive
        text: 'unexported-return:.*unexported type (?:\[\])?(celt|encoder)\.(opusVal16|opusVal32|celtNorm|celtGLog|celtEner)'
      - linters:
          - staticcheck
        path: ^internal/celt/(bands|dynalloc|encode_frame|pvq_search|qext_alloc)\.go$
        text: 'SA4006:'
      # FIXED_POINT twins of the CELT kernels: the t0/t3 swap in median_of_5 and the
      # pointer advance in xcorr_kernel_c's tail mirror libopus structure, and the
      # bit-exact port is LOCKED, so the redundant store is kept, not the lint. The
      # ineffassign rule below carries the same rationale.
      - linters:
          - staticcheck
        path: ^internal/fixedpoint/celt_(dynalloc_analysis|pitch)\.go$
        text: 'SA4006:'
      - linters:
          - staticcheck
        path: ^internal/encoder/encoder\.go$
        text: 'SA4006:'
      - linters:
          - staticcheck
        path: ^internal/silk/(libopus_decode|pitch_detect)\.go$
        text: 'SA4006:'
      # Seed the CI/static-analysis lane without crossing into unrelated runtime/tool
      # refactors owned by other workers.
      - linters:
          - errcheck
        path: ^internal/benchutil/opus_demo\.go$
      - linters:
          - errcheck
        path: ^tools/gen_opusdec_crossval_fixture\.go$
      - linters:
          - errcheck
          - ineffassign
        path: ^internal/encoder/encoder\.go$
      - linters:
          - ineffassign
        path: ^internal/celt/(bands|bands_quant|channel_adapters|decoder_flow_helpers|dynalloc|encode_frame|pvq_search|qext_alloc)\.go$
      # FIXED_POINT twins of the CELT kernels: the flagged stores are faithful
      # mirrors of libopus structure (median_of_5 swaps both halves, comb_filter
      # clamps both T0/T1, xcorr_kernel_c's final tail advances its pointers,
      # run_prefilter resets gain1) where one half is unused by the caller. The
      # bit-exact port is LOCKED, so the redundant store is kept, not the lint.
      - linters:
          - ineffassign
        path: ^internal/fixedpoint/celt_(dynalloc_analysis|encode|pitch|plc)\.go$
      - linters:
          - ineffassign
        path: ^multistream/framing\.go$
      - linters:
          - ineffassign
        path: ^internal/silk/(libopus_decode|pitch_detect)\.go$
    paths:
      # v1 excluded these trees through its default exclude-dirs list. The migration
      # emitted bare `examples$`-style patterns, which match the directory name
      # itself but not the files inside it, so the trees came back into scope.
      - ^builtin/
      - ^examples/
      - ^third_party/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - ^builtin/
      - ^examples/
      - ^third_party/
